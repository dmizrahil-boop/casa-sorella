<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="img/monograma.png">
<title>Casa Sorella Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a sand-colored rail of departments beside one cream work surface; the pipeline is a horizontal board of stages.
   Brand: Crema #F4EFE6 fondo, Arena #D9CBB4 superficies, Terracota #C97C5D acento, Grafito #2C2C2A texto, bronce del monograma */
:root{
  --bg:#F4EFE6; --surface:#FBF8F3; --sunk:#ECE4D6; --line:#DDD1BD; --fg:#2C2C2A; --muted:#6E675C;
  --accent:#A9583A; --accent-fg:#FFFFFF; --accent-soft:#F1DDD3; --terra:#C97C5D; --brass:#7E6A50; --brass-soft:#E8DFCF;
  --ok:#3F7A50; --ok-bg:#E2EEDF; --warn:#9A6513; --warn-bg:#F6E8CC; --bad:#B03A2A; --bad-bg:#F6DCD5;
  --display:'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --sans:'Helvetica Neue', Helvetica, Arial, system-ui, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2C2C2A; --surface:#353532; --sunk:#252523; --line:#4A4842; --fg:#F4EFE6; --muted:#B5AC9E;
  --accent:#D98E6F; --accent-fg:#2C2C2A; --accent-soft:#4A3A32; --terra:#D98E6F; --brass:#CDB896; --brass-soft:#45403A;
  --ok:#8CC79C; --ok-bg:#2F3F33; --warn:#E3B565; --warn-bg:#46391F; --bad:#EC8F7F; --bad-bg:#4A2D28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2C2C2A; --surface:#353532; --sunk:#252523; --line:#4A4842; --fg:#F4EFE6; --muted:#B5AC9E;
  --accent:#D98E6F; --accent-fg:#2C2C2A; --accent-soft:#4A3A32; --terra:#D98E6F; --brass:#CDB896; --brass-soft:#45403A;
  --ok:#8CC79C; --ok-bg:#2F3F33; --warn:#E3B565; --warn-bg:#46391F; --bad:#EC8F7F; --bad-bg:#4A2D28; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.num,td.n,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.rail{background:var(--sunk);border-right:1px solid var(--line);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:2px 10px 6px;color:var(--brass);text-decoration:none}
.brand .mono-img{height:46px;width:auto;display:block}
.brand .wm{font-family:var(--display);font-size:15px;letter-spacing:.28em;text-transform:uppercase;color:var(--brass);font-weight:500}
.brand small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .g{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin:12px 10px 3px;font-weight:600}
.nav .g:first-child{margin-top:0}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 10px;border-radius:5px;color:var(--fg);text-decoration:none}
.nav a:hover{background:var(--surface)}
.nav a.on{background:var(--fg);color:var(--bg)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a,.tabs button{padding:8px 14px;text-decoration:none;color:var(--muted);border:0;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;white-space:nowrap;cursor:pointer}
.tabs a:hover,.tabs button:hover{color:var(--fg)}
.tabs a.on,.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.tabs .sub{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px}
.nav .ct{font-family:var(--mono);font-size:11px;opacity:.7}
.nav a .ct.alert{background:var(--bad);color:#fff;opacity:1;padding:0 6px;border-radius:9px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted)}
.menu-btn,.mtitle{display:none}
.kpi .s a{color:var(--accent);text-decoration:none}
details.more{margin-top:12px}
details.more>summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.more>summary::before{content:"+";font-family:var(--mono);color:var(--accent)}
details.more[open]>summary::before{content:"−"}
details.more>.grid{margin-top:12px}
.nextbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--accent-soft);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.nextbar .lbl{font-size:12px;color:var(--muted)}
.nextbar b{color:var(--accent)}
.setup{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin-top:10px}
.setup a{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--fg);text-decoration:none;font-size:13px}
.setup a.done{opacity:.55}
.setup a i{font-style:normal;font-family:var(--mono);color:var(--accent)}
main{padding-block:26px 64px;padding-left:30px;padding-right:max(30px,env(safe-area-inset-right,0px));min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}
.head h1{font-family:var(--display);font-weight:500;font-size:38px;line-height:1.05}
.head p{margin:6px 0 0;color:var(--muted);max-width:72ch}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:5px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.dark{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.btn.danger{color:var(--bad)}
.btn.danger.arm{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
textarea{width:100%;min-height:64px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{color:var(--fg);font-size:14px}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg)}
.span2{grid-column:span 2}.spanall{grid-column:1/-1}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.panel h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);font-weight:600;margin-bottom:12px}
.sec{display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}.kpi.warn .v{color:var(--warn)}
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--sunk)}
tr.done td{opacity:.55}
tfoot td{font-weight:600;border-bottom:0}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--sunk);color:var(--fg)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}.pill.br{background:var(--brass-soft);color:var(--brass)}
.muted{color:var(--muted)}.small{font-size:12px}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px}
.banner{padding:10px 14px;border-radius:6px;background:var(--warn-bg);color:var(--warn);margin-bottom:16px}
.banner a{color:inherit;font-weight:600}
.bar{display:block;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.br i{background:var(--brass)}.bar.ok i{background:var(--ok)}.bar.bad i{background:var(--bad)}
.barl{display:grid;grid-template-columns:minmax(60px,1fr) auto;gap:6px;align-items:center;font-size:11px;font-family:var(--mono);color:var(--muted)}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{flex:0 0 232px;background:var(--sunk);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}
.col h3{font-size:12px;font-weight:600;display:flex;justify-content:space-between;gap:6px;color:var(--fg)}
.col h3 span{font-family:var(--mono);color:var(--muted);font-weight:400}
.col .tot{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:-4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:5px;text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.card.late{border-left:3px solid var(--bad)}
.card .t{font-weight:600}
.card .r{display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--muted);align-items:center}
.funnel{display:flex;flex-direction:column;gap:6px}
.frow{display:grid;grid-template-columns:170px minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:13px}
.frow .b{height:14px;background:var(--sunk);border-radius:3px;position:relative}
.frow .b i{position:absolute;inset:0 auto 0 0;background:var(--terra);border-radius:3px}
.vbars{display:flex;align-items:flex-end;gap:8px;height:180px;padding-top:10px;overflow-x:auto}
.vbars .c{flex:1 0 44px;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--muted)}
.vbars .c i{display:block;width:70%;background:var(--terra);border-radius:3px 3px 0 0;min-height:2px}
.vbars .c b{font-family:var(--mono);font-weight:500;color:var(--fg);font-size:11px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
.pc:hover{border-color:var(--muted)}
.pc .ph{aspect-ratio:4/3;background:var(--sunk);width:100%;object-fit:contain;display:block;max-width:100%}
.pc .bd{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.pc .bd b{font-weight:600}
.pc .bd span{font-size:11px;color:var(--muted);font-family:var(--mono)}
.ov{position:fixed;inset:0;background:rgba(30,28,24,.45);display:flex;justify-content:flex-end;z-index:50}
.drawer{background:var(--bg);width:min(1020px,100%);height:100%;overflow-y:auto;padding-block:max(18px,env(safe-area-inset-top,0px)) 80px;padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.drawer.narrow{width:min(640px,100%)}
.dhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:start;gap:10px;position:sticky;top:calc(-1 * max(18px,env(safe-area-inset-top,0px)));background:var(--bg);padding-block:8px;z-index:2;border-bottom:1px solid var(--line)}
.dhead h2{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.1}
.calc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;font-size:13px}
.calc .n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.calc .hr{grid-column:1/-1;border-top:1px solid var(--line);margin:4px 0}
.calc .big{font-weight:600;font-size:15px}
.it input{width:100%}
.it td{padding:4px}
.stages{display:flex;flex-wrap:wrap;gap:4px}
.stg{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer}
.stg.done{background:var(--brass-soft);border-color:transparent;color:var(--brass)}
.stg.cur{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:600}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.checks .auto{font-size:11px;color:var(--muted)}
.sched{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 14px;font-size:13px;align-items:center}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:5px;z-index:99;font-weight:500;max-width:90vw}
.thumb{width:44px;height:44px;object-fit:contain;border-radius:4px;background:var(--sunk);display:block}
.quote{background:#FBF8F3;color:#2C2C2A;border:1px solid var(--line);border-radius:6px;padding:24px;font-size:13px}
pre.rfq{white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:var(--sunk);padding:12px;border-radius:5px;max-height:320px;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips label{display:flex;gap:4px;align-items:center;font-size:13px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.log li{border-left:2px solid var(--terra);padding-left:10px;font-size:13px}
.log li .w{font-size:11px;color:var(--muted)}
.agenda .day{font-size:11px;font-weight:600;color:var(--terra);text-transform:uppercase;letter-spacing:.1em;margin:14px 0 6px}
.agenda .day:first-child{margin-top:0}
.ev{display:grid;grid-template-columns:160px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:5px;margin-bottom:6px;cursor:pointer}
.ev.over{border-left:3px solid var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;cursor:pointer}
.seg button.on{background:var(--fg);color:var(--bg)}
.flow{display:grid;grid-template-columns:118px repeat(6,minmax(118px,1fr));gap:8px;min-width:860px}
.flow .ph{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--terra);padding:8px 4px;border-right:2px solid var(--terra);display:flex;align-items:center}
.flow .ln{position:sticky;top:0}
.flow .ln{font-weight:600;font-size:13px;padding:10px 8px;background:var(--sunk);border-radius:5px;display:flex;flex-direction:column;justify-content:center}
.flow .ln small{font-weight:400;color:var(--muted);font-size:11px}
.flow .cell{display:flex;flex-direction:column;gap:6px;padding:4px 0}
.flow .st{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:7px 8px;font-size:12px;line-height:1.35}
.flow .st b{font-family:var(--mono);color:var(--accent);margin-right:4px}
.flow .st.money{border-color:var(--brass);background:var(--brass-soft)}
.flow .st.sys{border-style:dashed}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:10px;border-radius:2px;border:1px solid var(--line);display:inline-block;background:var(--surface)}
.legend i.m{background:var(--brass-soft);border-color:var(--brass)}.legend i.s{border-style:dashed}
.steps{counter-reset:s;display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));padding:0;margin:0}
.steps li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:13px}
.steps li h3{font-size:14px;margin-bottom:4px;display:flex;gap:8px;align-items:baseline}
.steps li h3::before{counter-increment:s;content:counter(s);font-family:var(--mono);color:var(--terra);font-size:13px}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px;z-index:10;overflow:visible;border-right:0;border-bottom:1px solid var(--line)}
  .rail .foot,.brand .wm,.brand small{display:none}
  .brand{padding:0}.brand .mono-img{height:30px}
  .mtitle{display:block;flex:1;min-width:0;font-family:var(--display);font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .menu-btn{display:inline-block}
  .nav{display:none;flex-basis:100%;padding:6px 0 4px;max-height:70vh;overflow-y:auto}
  .rail.open .nav{display:flex}
  .nav a{padding:10px 10px}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .frow{grid-template-columns:110px minmax(0,1fr) 90px}
  .drawer{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .checks{grid-template-columns:1fr}
  .ev{grid-template-columns:1fr auto}.ev .w{grid-column:1/-1}
  .head h1{font-size:30px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--sunk)}
}
@media (max-width:480px){.g2,.g3,.g4{grid-template-columns:1fr}.span2{grid-column:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="shell">
  <aside class="rail">
    <a class="brand" id="brand" href="#hoy"><span class="wm">Casa Sorella</span><small>Control de proyectos</small></a>
    <span class="mtitle" id="mtitle"></span>
    <button class="btn menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">Menú</button>
    <nav class="nav" id="nav"></nav>
    <div class="foot">Los cambios se guardan para todo el equipo.</div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script src="config.js" charset="utf-8"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="adapter.js" charset="utf-8"></script>
<script>
/* ================= catálogos fijos ================= */
const STAGES=[
  {k:'cotizando',n:'Cotizando',rol:'ventas',h:'Levantar medidas y armar propuesta'},

function defPlan(){const a=num(S.cfg.anticipoPct);return [{id:rid(),concepto:'Anticipo para fabricar',pct:a,fecha:''},{id:rid(),concepto:'Saldo contra entrega',pct:100-a,fecha:''}]}
const nrm=v=>String(v||'').toLowerCase().replace(/\s+/g,'').replace(/[x×*]/g,'x');
function itOk(it){return !!(it&&it.conf&&num(it.costoUSD)>0&&nrm(it.conf.m)===nrm(it.medidas)&&nrm(it.conf.t)===nrm(it.material))}
function itConfirm(it,how){it.conf={m:it.medidas||'',t:it.material||'',f:today(),how:how||'harry'}}
function nEstim(p){return (p.items||[]).filter(i=>(i.sku||i.nombre)&&!itOk(i)).length}
function histMatch(sku,med,mat){const s=S.skus.find(x=>x.sku===sku);if(!s)return null;const H=(s.historial||[]).filter(h=>num(h.costoUSD)>0&&h.medidas&&nrm(h.medidas)===nrm(med));if(!H.length)return null;return H.filter(h=>nrm(h.material)===nrm(mat)).slice(-1)[0]||H.slice(-1)[0]}
function planPcts(p){const pl=(p.plan&&p.plan.length)?p.plan:defPlan();return pl.map(x=>num(x.pct)/100)}
function calc(p){
  const tc=num(p.tc)||num(S.cfg.tc);
  const items=p.items||[];
  const fabUSD=items.reduce((a,i)=>a+num(i.cant)*num(i.costoUSD),0);
  const cbm=items.reduce((a,i)=>a+num(i.cant)*num(i.cbm),0);
  const tarifa=num(p.fleteRealUSD)||num(p.fleteCBMusd), tcFlete=num(p.tcFlete)||tc, tarifaReal=!!num(p.fleteRealUSD);
  const fabMXN=fabUSD*tc, fleteMXN=cbm*tarifa*tcFlete;
  const cbmFalta=items.filter(i=>!num(i.cbm)).length;
  const entregaMXN=num(p.entregaMXN), aduanaMXN=num(p.aduanaMXN), otrosMXN=num(p.otrosMXN);
  const sum=(arr,f)=>(arr||[]).reduce((a,x)=>a+num(x[f]),0);
  const pagosProv=p.pagosProv||[];
  const provPagUSD=sum(pagosProv,'usd');
  const envioReal=sum(pagosProv,'comisionMXN');
  const envioMXN=pagosProv.length?envioReal:fabMXN*num(S.cfg.envioPct)/100;
  const provPagMXN=pagosProv.reduce((a,x)=>a+num(x.usd)*(num(x.tc)||tc),0);
  const logMXN=fleteMXN+entregaMXN+aduanaMXN;
  const costo=fabMXN+logMXN+otrosMXN+envioMXN;
  const m=num(p.margenPct)/100, c=num(p.comisionPct)/100;
  const r0=num(S.cfg.redondeo);let sugerido=(1-m-c)>0?costo/(1-m-c):NaN;if(r0>0&&isFinite(sugerido))sugerido=Math.ceil(sugerido/r0)*r0;
  const precio=num(p.precioManual)>0?num(p.precioManual):sugerido;
  const comision=precio*c, utilidad=precio-costo-comision, margenReal=precio>0?utilidad/precio:NaN;
  const iva=p.iva===false?0:precio*num(S.cfg.ivaPct)/100, total=precio+iva;
  const cobrado=sum(p.cobros,'monto'), logPag=sum(p.pagosLog,'mxn'), comPag=sum(p.pagosCom,'mxn');
  const conf=isConfirmed(p)||cobrado>0||provPagUSD>0;
  const pl=p.pagosLog||[];const conOf=x=>x.concepto||'flete';
  const pagCon=k=>pl.filter(x=>conOf(x)===k).reduce((a,x)=>a+num(x.mxn),0);
  const cbmPag=pl.filter(x=>conOf(x)==='flete').reduce((a,x)=>a+(num(x.cbm)||(tarifa*tcFlete>0?num(x.mxn)/(tarifa*tcFlete):0)),0);
  const logRows=[{k:'flete',n:'Flete marítimo',base:`${cbm.toFixed(2)} CBM × USD ${tarifa} × ${tcFlete}`,monto:fleteMXN,pag:pagCon('flete')},{k:'aduana',n:'Aduana e impuestos',base:'',monto:aduanaMXN,pag:pagCon('aduana')},{k:'entrega',n:'Entrega e instalación local',base:'',monto:entregaMXN,pag:pagCon('entrega')}];
  const bp=num(S.cfg.brokerAnticipoPct)/100;
  return {tarifa,tcFlete,tarifaReal,cbmFalta,cbmPag,logRows,tc,fabUSD,cbm,fabMXN,fleteMXN,entregaMXN,aduanaMXN,otrosMXN,envioMXN,envioReal,envioEst:!pagosProv.length,provPagMXN,logMXN,costo,sugerido,precio,comision,utilidad,margenReal,iva,total,cobrado,
    pctCobrado:total>0?cobrado/total:0,porCobrar:conf?Math.max(0,total-cobrado):0,
    provPagUSD,pctBroker:fabUSD>0?provPagUSD/fabUSD:0,provDebeUSD:conf?Math.max(0,fabUSD-provPagUSD):0,brokerAnt:fabUSD*bp,brokerSaldo:fabUSD*(1-bp),
    logPag,logDebe:conf?Math.max(0,logMXN-logPag):0,comPag,comDebe:conf?Math.max(0,comision-comPag):0,conf};
}
// plan de cobro: cuánto ya debería haber pagado el cliente y cuál es el siguiente pago
function cobranza(p,c){c=c||calc(p);const pl=(p.plan&&p.plan.length)?p.plan:defPlan();let acum=0,venc=0,next=null;const t=today();const rows=pl.map(x=>{const m=c.total*num(x.pct)/100;const desde=acum;acum+=m;const pag=Math.max(0,Math.min(m,c.cobrado-desde));const due=x.fecha||'';const st=m<=0?'pendiente':pag>=m-1?'pagado':pag>0?'parcial':'pendiente';if(st!=='pagado'&&!next)next={...x,monto:m-pag,due};if(st!=='pagado'&&due&&due<t)venc+=m-pag;return {...x,monto:m,pag,st,due}});
  return {rows,pagados:rows.filter(r=>r.st==='pagado').length,n:rows.length,vencido:venc,next}}
const NEXT={cotizando:p=>(p.items||[]).length?(nEstim(p)?'Pedir precios a Harry':'Mandar cotización al cliente'):'Agregar piezas del catálogo',china:()=>`Esperar precios de ${provName(defBroker())||'el broker'}`,cliente:()=>'Dar seguimiento a la cotización',confirmado:()=>'Cobrar anticipo',orden:()=>'Enviar 50% a Harry',produccion:()=>'Pedir fotos de producción',listo:()=>'Inspección y pagar saldo a Harry',transito:()=>'Seguir el contenedor',aduana:()=>'Liberar en aduana',entrega:()=>'Entregar e instalar',entregado:()=>'Cobrar saldo y firmar acta'};
function nextAction(p){const f=NEXT[p.etapa];return f?f(p):''}
function nextStep(d,id){const its=d.items||[];const c=calc(d);const rfq=S.rfqs.filter(r=>r.proyectoId&&r.proyectoId===id).slice(-1)[0];
  switch(d.etapa){
    case 'cotizando':if(!its.length)return {l:'Agregar piezas del catálogo',a:'pick'};if(nEstim(d))return rfq&&rfq.status==='borrador'?{l:'Mandar la solicitud a Harry',a:'openRfq',x:rfq.id}:{l:'Pedir precios a Harry',a:'toRfq'};return {l:'Ver y mandar cotización',a:'quote'};
    case 'china':return rfq?{l:'Capturar los precios de Harry',a:'openRfq',x:rfq.id}:{l:'Pedir precios a Harry',a:'toRfq'};
    case 'cliente':return {l:'Subir cotización firmada',a:'tab',x:'docs'};
    case 'confirmado':return {l:'Registrar anticipo del cliente',a:'pCobro'};
    case 'orden':return {l:'Registrar 50% a Harry',a:'pProv'};
    case 'produccion':return c.provPagUSD>=c.fabUSD-0.5?{l:'Marcar listo en fábrica',a:'stage',x:'listo'}:{l:'Marcar listo en fábrica',a:'stage',x:'listo'};
    case 'listo':return c.fabUSD>0&&c.provPagUSD<c.fabUSD-0.5?{l:'Registrar saldo a Harry',a:'pProv'}:{l:'Agregar a un embarque',a:'goEmb'};
    case 'transito':case 'aduana':return d.embarqueId?{l:'Ver embarque',a:'openEmb',x:d.embarqueId}:{l:'Agregar a un embarque',a:'goEmb'};
    case 'entrega':return S.taller.some(t=>t.proyectoId===id)?{l:'Marcar entregado e instalado',a:'stage',x:'entregado'}:{l:'Programar instalación con carpintero',a:'toTaller'};
    case 'entregado':return c.porCobrar>1?{l:'Registrar saldo del cliente',a:'pCobro'}:{l:'Pagar pendientes para liquidar',a:'tab',x:'dinero'};
  }return null}
function autoAdvance(d){const c=calc(d);const moved=[];const go=k=>{moveStage(d,k);moved.push(SN[k])};
  if(SI[d.etapa]<SI.confirmado&&(c.cobrado>0||c.provPagUSD>0)){if(!num(d.precioManual)&&c.precio>0)d.precioManual=Math.round(c.precio);(d.cotizaciones||[]).forEach((q,i,a)=>{if(i===a.length-1&&q.estado!=='aceptada')q.estado='aceptada'});go('confirmado')}
  if(d.etapa==='confirmado'&&c.total>0&&c.cobrado>=c.total*planPcts(d)[0]-1)go('orden');
  if(d.etapa==='orden'&&c.fabUSD>0&&c.provPagUSD>=c.brokerAnt-0.5)go('produccion');
  if(d.etapa==='produccion'&&c.fabUSD>0&&c.provPagUSD>=c.fabUSD-0.5)go('listo');
  if(d.etapa==='entregado'&&c.total>0&&c.cobrado>=c.total-1&&c.provPagUSD>=c.fabUSD-0.5)go('liquidado');
  return moved}
function isConfirmed(p){const i=SI[p.etapa];return i>=SI.confirmado&&p.etapa!=='perdido'}
function isActive(p){return p.etapa!=='liquidado'&&p.etapa!=='perdido'}
function respOf(p){const st=STAGES[SI[p.etapa]];if(!st||!st.rol)return null;return (p.resp||{})[st.rol]||null}
function lateBy(p){if(!isActive(p))return 0;return days(p.etapaDesde)-stageSla(p.etapa)}
function stageProg(p){if(p.etapa==='perdido')return 0;return SI[p.etapa]/SI.liquidado}
function checkState(p,c){c=c||calc(p);const ch=p.check||{};return CHECK.map(x=>({...x,done:x.auto?!!x.auto(c,p):!!ch[x.k],fecha:ch[x.k]||''}))}

function embCalc(e){const tc=num(e.tc)||num(S.cfg.tc);const fleteMXN=num(e.fleteUSD)*tc;const total=fleteMXN+num(e.aduanaMXN)+num(e.otrosMXN);const ps=(e.proyectos||[]).map(proj).filter(Boolean);
  const cs=ps.map(p=>({p,c:calc(p),pag:(p.pagosLog||[]).filter(y=>(y.concepto||'flete')!=='entrega').reduce((a,y)=>a+num(y.mxn),0)}));
  const cbm=cs.reduce((a,x)=>a+x.c.cbm,0);const est=cs.reduce((a,x)=>a+x.c.fleteMXN+x.c.aduanaMXN,0);const pag=num(e.pagadoMXN)+cs.reduce((a,x)=>a+x.pag,0);
  return {tc,fleteMXN,total,pag,debe:Math.max(0,total-pag),cbm,est,ps,cs,rate:cbm>0?num(e.fleteUSD)/cbm:0}}

async function boot(){
  render();
  if(!window.claude||!window.claude.use){S.noDb=true;render();return}
  try{db=await claude.use('db')}catch(e){db=null}
  if(!db){S.noDb=true;render();return}
  const onErr=e=>{if(e&&e.code!=='revoked')toast(errMsg(e))};
  db.doc('config/main').onSnapshot(s=>{const d=s.exists?s.data():{};S.cfg=Object.assign(clone(DEF_CFG),clone(d));S.cfg.sla=Object.assign({},DEF_SLA,d.sla||{});S.cfg.personas=clone(d.personas||[]);S.loaded.cfg=true;schedule()},onErr);
  COLLS.forEach(c=>db.collection(c).onSnapshot(snap=>{S[c]=snap.docs.map(d=>{const o=Object.assign({id:d.id},clone(d.data()));if(c==='proyectos'&&o.etapa==='instalacion')o.etapa='entrega';return o});S.loaded[c]=true;schedule()},onErr));

}

/* ----- Resumen ----- */
function vInicio(){
  const P=S.proyectos;const tc=num(S.cfg.tc);
  let porCobrar=0,provUSD=0,logDebe=0,comDebe=0,utilProy=0,utilReal=0,ventaActiva=0,vencido=0;
  P.forEach(p=>{const c=calc(p);porCobrar+=c.porCobrar;provUSD+=c.provDebeUSD;logDebe+=c.logDebe;comDebe+=c.comDebe;if(c.conf&&p.etapa!=='liquidado')utilProy+=c.utilidad;if(p.etapa==='liquidado')utilReal+=c.utilidad;if(isActive(p))ventaActiva+=c.total;if(c.conf)vencido+=cobranza(p,c).vencido});
  const carp=S.taller.reduce((a,t)=>a+tallerCalc(t).debe,0);
  const late=P.filter(p=>lateBy(p)>0).sort((a,b)=>lateBy(b)-lateBy(a));
  const debemos=provUSD*TCG()+logDebe+carp+comDebe;const enBanco=S.cuentas.length?(()=>{const sd=saldos();return S.cuentas.reduce((a,c)=>a+sd[c.id].saldo,0)})():null;
  const kp=`<div class="kpis">
    <div class="kpi"><div class="l">Nos deben clientes</div><div class="v">${mx(porCobrar)}</div><div class="s">${vencido>1?`<span style="color:var(--bad)">${mx(vencido)} vencido</span>`:'Nada vencido'} · <a href="#cobranza">Cobranza</a></div></div>
    <div class="kpi ${debemos>1?'warn':''}"><div class="l">Debemos</div><div class="v">${mx(debemos)}</div><div class="s">Harry ${us(provUSD)} · logística ${mx(logDebe)}${carp+comDebe>1?` · otros ${mx(carp+comDebe)}`:''}</div></div>
    <div class="kpi"><div class="l">En bancos</div><div class="v">${enBanco==null?'—':mx(enBanco)}</div><div class="s"><a href="#bancos">${enBanco==null?'Agrega tus cuentas':'Ver cuentas'}</a></div></div>
    <div class="kpi ok"><div class="l">Utilidad en curso</div><div class="v">${mx(utilProy)}</div><div class="s">Realizada: ${mx(utilReal)}</div></div>
  </div>`;
  const lateHtml=late.length?`<div class="tw"><table><thead><tr><th>Proyecto</th><th>Etapa</th><th>Lo tiene</th><th class="n">Días</th><th class="n">Límite</th></tr></thead><tbody>${late.map(p=>`<tr class="click" data-open-p="${esc(p.id)}"><td><b>${esc(p.folio)}</b> ${esc(p.nombre||p.cliente)}</td><td><span class="pill">${esc(SN[p.etapa])}</span></td><td>${esc(pname(respOf(p))||'Sin asignar')}</td><td class="n"><span class="pill bad">${days(p.etapaDesde)}</span></td><td class="n">${stageSla(p.etapa)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Ningún proyecto rebasa el tiempo límite de su etapa.</div>`;
  const rows={};const act=P.filter(isActive);
  act.forEach(p=>{const st=STAGES[SI[p.etapa]];if(!st||!st.rol)return;const id=respOf(p)||'_';rows[id]=rows[id]||{n:0,late:0};rows[id].n++;if(lateBy(p)>0)rows[id].late++});
  S.tareas.filter(t=>!t.hecha).forEach(t=>{const id=t.personaId||'_';rows[id]=rows[id]||{n:0,late:0};rows[id].t=(rows[id].t||0)+1;if(t.vence&&t.vence<today())rows[id].tl=(rows[id].tl||0)+1});
  act.filter(p=>p.proxContacto&&p.proxContacto<today()).forEach(p=>{const id=(p.resp||{}).ventas||'_';rows[id]=rows[id]||{n:0,late:0};rows[id].s=(rows[id].s||0)+1});
  const pr=Object.entries(rows).sort((a,b)=>(b[1].late+(b[1].tl||0)+(b[1].s||0))-(a[1].late+(a[1].tl||0)+(a[1].s||0))||b[1].n-a[1].n);
  const people=pr.length?`<div class="tw"><table><thead><tr><th>Persona</th><th class="n">Proyectos</th><th class="n">Atrasados</th><th class="n">Tareas vencidas</th><th class="n">Seguimientos vencidos</th></tr></thead><tbody>${pr.map(([id,r])=>`<tr><td>${id==='_'?'<span class="pill warn">Sin responsable</span>':esc(pname(id))}</td><td class="n">${r.n}</td><td class="n">${r.late?`<span class="pill bad">${r.late}</span>`:'0'}</td><td class="n">${r.tl?`<span class="pill bad">${r.tl}</span>`:'0'}</td><td class="n">${r.s?`<span class="pill bad">${r.s}</span>`:'0'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Cuando haya proyectos activos verás aquí quién tiene la pelota.</div>`;
  const prog=act.length?`<div class="tw"><table><thead><tr><th>Proyecto</th><th>Etapa</th><th style="min-width:110px">Avance</th><th style="min-width:110px">Checklist</th><th style="min-width:120px">Cobrado</th><th style="min-width:120px">Pagado broker</th><th class="n">Llega</th></tr></thead><tbody>${act.sort((a,b)=>SI[b.etapa]-SI[a.etapa]).map(p=>{const c=calc(p);const cb=cobranza(p,c);const eta=p.eta?daysTo(p.eta):null;return `<tr class="click" data-open-p="${esc(p.id)}"><td><b class="mono">${esc(p.folio)}</b> ${esc(p.nombre||p.cliente||'')}</td><td class="small">${esc(SN[p.etapa])}</td><td>${barl(stageProg(p))}</td><td>${barl(checkProg(p,c),'br')}</td><td>${c.conf?barl(c.pctCobrado,'ok',`${cb.pagados}/${cb.n}`):'<span class="small muted">—</span>'}</td><td>${c.conf?barl(c.pctBroker,'br',`${(p.pagosProv||[]).length}/2`):'<span class="small muted">—</span>'}</td><td class="n small">${p.eta?`${fdate(p.eta)}${eta!=null&&eta>=0?` · ${eta} d`:''}`:'—'}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Sin proyectos activos.</div>';
  const next=agendaEvents().filter(e=>e.over||e.dt<=addDays(today(),7)).slice(0,8);
  const fs=STAGES.filter(s=>s.k!=='perdido').map(s=>{const ps=P.filter(p=>p.etapa===s.k);return {s,n:ps.length,v:ps.reduce((a,p)=>a+calc(p).total,0)}});
  const maxV=Math.max(1,...fs.map(f=>f.v));
  const funnel=`<div class="funnel">${fs.map(f=>`<div class="frow"><span>${esc(f.s.n)} <span class="muted mono">${f.n}</span></span><div class="b"><i style="width:${(f.v/maxV*100).toFixed(1)}%"></i></div><span class="num" style="text-align:right">${mx(f.v)}</span></div>`).join('')}</div>`;
  return head('Resumen',`${act.length} proyectos activos · ${mx(ventaActiva)} entre propuestas y pedidos`,`<button class="btn pri" data-act="newP">Nuevo proyecto</button>`)+
  `<div class="sec">${setupHtml()}${kp}
   <div class="grid g2"><div class="panel"><h2>Dónde se está atorando</h2>${lateHtml}</div><div class="panel"><h2>Quién tiene la pelota</h2>${people}</div></div>
   <div class="panel"><h2>Avance de proyectos activos</h2>${prog}</div>
   <div class="panel"><h2>Embudo por etapa (valor con IVA)</h2>${funnel}</div></div>`;
}

/* ----- Agenda ----- */
function agendaEvents(){const E=[];const t=today();
  const push=o=>{o.dt=o.dt||t;o.over=o.dt<t&&!o.noOver;E.push(o)};
  S.proyectos.filter(isActive).forEach(p=>{const c=calc(p);const i=SI[p.etapa];const lbl=`${p.folio} ${p.nombre||p.cliente||''}`;const r=p.resp||{};
    if(c.conf){const cb=cobranza(p,c);if(cb.next&&(cb.next.due||i===SI.confirmado||i>=SI.entrega))push({dt:cb.next.due||(p.etapaDesde||'').slice(0,10),tipo:'Cobrar: '+cb.next.concepto,tone:'ok',txt:lbl,monto:mx(cb.next.monto),who:r.cobranza||r.ventas,open:['p',p.id]})}
    if(i>=SI.orden&&i<=SI.produccion&&c.fabUSD>0&&c.provPagUSD<c.brokerAnt-0.5)push({dt:(p.etapaDesde||'').slice(0,10),tipo:'Pagar 50% broker',tone:'br',txt:lbl,monto:us(c.brokerAnt-c.provPagUSD),who:r.compras,open:['p',p.id]});
    if(i===SI.listo&&c.provPagUSD<c.fabUSD-0.5)push({dt:(p.etapaDesde||'').slice(0,10),tipo:'Pagar saldo broker',tone:'br',txt:lbl,monto:us(c.fabUSD-c.provPagUSD),who:r.compras,open:['p',p.id]});
    if(p.eta&&i<SI.entrega)push({dt:p.eta,tipo:'Llegada estimada',tone:'acc',txt:lbl,who:r.logistica,open:['p',p.id],noOver:true});
    if(p.fechaEntrega&&i<=SI.entrega)push({dt:p.fechaEntrega,tipo:'Entrega prometida',tone:'warn',txt:lbl,who:r.cobranza||r.ventas,open:['p',p.id]});
    if(p.proxContacto)push({dt:p.proxContacto,tipo:'Seguimiento',tone:'acc',txt:lbl,who:r.ventas,open:['seg',p.id]});
  });
  S.embarques.filter(e=>e.status!=='bodega').forEach(e=>{if(e.eta)push({dt:e.eta,tipo:'Llega embarque',tone:'acc',txt:`${e.folio} ${e.contenedor||''}`,who:e.resp,open:['g','embarques',e.id],noOver:true})});
  S.taller.filter(x=>!['terminado','cancelado'].includes(x.status)).forEach(x=>push({dt:x.fecha||t,tipo:optLabel(TALLER_T,x.tipo)||'Taller',tone:'warn',txt:`${x.folio} ${projLabel(x.proyectoId)||x.cliente||''} · ${provName(x.carpinteroId)||'sin carpintero'}`,who:x.resp,open:['g','taller',x.id]}));
  S.tareas.filter(x=>!x.hecha).forEach(x=>push({dt:x.vence||t,tipo:'Tarea',tone:'',txt:x.titulo,who:x.personaId,open:['g','tareas',x.id],noDate:!x.vence}));
  return E.sort((a,b)=>(b.over-a.over)||a.dt.localeCompare(b.dt));
}
function evHtml(e){return `<div class="ev ${e.over?'over':''}" data-ev="${esc(e.open.join('|'))}"><span><span class="pill ${e.tone}">${esc(e.tipo)}</span></span><span class="w" style="min-width:0">${esc(e.txt)}${e.who?` <span class="small muted">· ${esc(pname(e.who))}</span>`:''}</span><span class="num small">${e.monto||''} ${e.over?`<span class="pill bad">${days(e.dt)} d tarde</span>`:e.noDate?'':`<span class="muted">${fdate(e.dt)}</span>`}</span></div>`}
function vAgenda(){const E=agendaEvents().filter(e=>!UI.persona||e.who===UI.persona);
  const groups={};E.forEach(e=>{const k=e.over?'Vencidos':e.dt===today()?'Hoy':e.dt<=addDays(today(),7)?'Próximos 7 días':e.dt<=addDays(today(),30)?'Este mes':'Más adelante';(groups[k]=groups[k]||[]).push(e)});
  return head('Agenda','Todo lo que tiene fecha: cobros, pagos a Harry, seguimientos, llegadas, instalaciones y tareas.',personSel('pp')+`<button class="btn" data-act="newT">Nueva tarea</button>`)+
  `<div class="panel agenda">${E.length?['Vencidos','Hoy','Próximos 7 días','Este mes','Más adelante'].filter(k=>groups[k]).map(k=>`<div class="day">${k} · ${groups[k].length}</div>${groups[k].map(evHtml).join('')}`).join(''):'<div class="empty">Sin pendientes.</div>'}</div>`}

/* ----- Proyectos ----- */
function filtP(){const q=UI.q.toLowerCase();return S.proyectos.filter(p=>(!q||[p.folio,p.nombre,p.cliente].join(' ').toLowerCase().includes(q))&&(!UI.persona||Object.values(p.resp||{}).includes(UI.persona)))}
function vProyectos(){

  let body;

  else if(UI.vista==='tablero'){
    body=`<div class="board">${STAGES.map(s=>{const ps=P.filter(p=>p.etapa===s.k).sort((a,b)=>lateBy(b)-lateBy(a));const v=ps.reduce((a,p)=>a+calc(p).total,0);

  }
  return head('Proyectos','En rojo, los que pasaron el límite de días de su etapa.',tools)+body;
}
function cardP(p){const c=calc(p);const l=lateBy(p);const r=pname(respOf(p));
  return `<button class="card ${l>0?'late':''}" data-open-p="${esc(p.id)}"><span class="r"><span class="mono">${esc(p.folio)}</span>${isActive(p)?`<span class="pill ${l>0?'bad':l>-2?'warn':''}">${days(p.etapaDesde)} d</span>`:''}</span><span class="t">${esc(p.nombre||p.cliente||'Sin nombre')}</span><span class="small muted">${esc(p.cliente||'')}</span>${isActive(p)?`<span class="small" style="color:var(--accent)">→ ${esc(nextAction(p))}</span>`:''}<span class="r"><span class="num">${mx(c.total)}</span><span>${esc(r||'Sin asignar')}</span></span>${bar(checkProg(p,c),'br')}${c.conf?`<span class="r"><span>Cobrado</span><span class="num">${pct(c.pctCobrado)}</span></span>${bar(c.pctCobrado,'ok')}`:''}</button>`}

function vCotizaciones(){const P=S.proyectos.filter(p=>(p.cotizaciones||[]).length||['cotizando','china','cliente'].includes(p.etapa)).filter(p=>!UI.persona||(p.resp||{}).ventas===UI.persona);

  <div class="panel tw">${P.length?`<table><thead><tr><th>Folio</th><th>Proyecto</th><th>Cotiza</th><th>Etapa</th><th class="n">Versión</th><th>Estado</th><th class="n">Enviada</th><th class="n">Vigencia</th><th class="n">Seguimiento</th><th class="n">Total</th><th class="n">Margen</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty">Sin cotizaciones. Crea un proyecto, agrega partidas y usa <b>Registrar envío de cotización</b>.</div>'}</div></div>`}

/* ----- Cobranza ----- */
function vCobranza(){let P=S.proyectos.filter(p=>isConfirmed(p)||(p.cobros||[]).length).map(p=>{const c=calc(p);return {p,c,cb:cobranza(p,c)}});
  if(UI.persona)P=P.filter(x=>Object.values(x.p.resp||{}).includes(UI.persona));
  const L=UI.cobF==='pendientes'?P.filter(x=>x.c.porCobrar>1):UI.cobF==='vencidos'?P.filter(x=>x.cb.vencido>1):P;
  const tot=P.reduce((a,x)=>a+x.c.total,0),cob=P.reduce((a,x)=>a+x.c.cobrado,0),venc=P.reduce((a,x)=>a+x.cb.vencido,0);
  const all=[];S.proyectos.forEach(p=>(p.cobros||[]).forEach(c=>all.push({p,c})));all.sort((a,b)=>String(b.c.fecha).localeCompare(String(a.c.fecha)));
  const mes=today().slice(0,7);const cobMes=all.filter(x=>String(x.c.fecha).startsWith(mes)).reduce((a,x)=>a+num(x.c.monto),0);
  const seg=`<span class="seg">${[['pendientes','Con saldo'],['vencidos','Vencidos'],['todos','Todos']].map(([k,n])=>`<button class="${UI.cobF===k?'on':''}" data-cobf="${k}">${n}</button>`).join('')}</span>`;
  return head('Cobranza','Cuánto lleva pagado cada cliente y qué pago sigue.',personSel('pp')+seg+`<button class="btn pri" data-act="newCobro">Registrar pago de cliente</button>`)+
  `<div class="sec"><div class="kpis"><div class="kpi"><div class="l">Vendido confirmado</div><div class="v">${mx(tot)}</div></div><div class="kpi ok"><div class="l">Cobrado</div><div class="v">${mx(cob)}</div><div class="s">${bar(tot?cob/tot:0,'ok')}</div></div><div class="kpi"><div class="l">Por cobrar</div><div class="v">${mx(tot-cob)}</div></div><div class="kpi ${venc>1?'bad':''}"><div class="l">Vencido</div><div class="v">${mx(venc)}</div><div class="s">Según fechas del plan</div></div><div class="kpi"><div class="l">Cobrado este mes</div><div class="v">${mx(cobMes)}</div></div></div>
  <div class="panel tw"><h2>Por proyecto</h2>${L.length?`<table><thead><tr><th>Proyecto</th><th>Cobra</th><th class="n">Total</th><th class="n">Pagos</th><th style="min-width:140px">Avance</th><th>Siguiente pago</th><th class="n">Vencido</th><th class="n">Saldo</th><th></th></tr></thead><tbody>${L.map(({p,c,cb})=>`<tr><td class="click" data-open-p="${esc(p.id)}" style="cursor:pointer"><b class="mono">${esc(p.folio)}</b> ${esc(p.nombre||'')}<div class="small muted">${esc(p.cliente||'')}</div></td><td>${esc(pname((p.resp||{}).cobranza||(p.resp||{}).ventas)||'—')}</td><td class="n">${mx(c.total)}</td><td class="n">${cb.pagados} de ${cb.n}<div class="small muted">${(p.cobros||[]).length} abonos</div></td><td>${barl(c.pctCobrado,'ok')}</td><td class="small">${cb.next?`${esc(cb.next.concepto)} · <b class="num">${mx(cb.next.monto)}</b>${cb.next.due?`<div class="muted">${fdate(cb.next.due)}</div>`:''}`:'<span class="pill ok">Liquidado</span>'}</td><td class="n">${cb.vencido>1?`<span class="pill bad">${mx(cb.vencido)}</span>`:'—'}</td><td class="n"><b>${mx(c.porCobrar)}</b></td><td><div class="tools" style="flex-wrap:nowrap">${c.porCobrar>1&&p.telefono&&cb.next?waLink(p.telefono,`Hola ${(p.cliente||'').split(' ')[0]}, te recordamos el pago de ${cb.next.concepto.toLowerCase()} de tu proyecto ${p.nombre||''} por ${mx(cb.next.monto)}${cb.next.due?' con fecha '+fdate(cb.next.due):''}. ¡Gracias! ${S.cfg.empresa}`,'Recordar'):''}${c.porCobrar>1?`<button class="btn sm" data-cobro="${esc(p.id)}">Registrar pago</button>`:''}</div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Nada que mostrar con este filtro.</div>'}</div>
  <div class="panel tw"><h2>Pagos recibidos</h2>${all.length?`<table><thead><tr><th>Fecha</th><th>Proyecto</th><th>Concepto</th><th>Método</th><th>Referencia</th><th class="n">Monto</th></tr></thead><tbody>${all.slice(0,100).map(({p,c})=>`<tr class="click" data-open-p="${esc(p.id)}"><td>${fdate(c.fecha)}</td><td><span class="mono">${esc(p.folio)}</span> ${esc(p.cliente||'')}</td><td>${esc(c.nota||'')}</td><td>${esc(optLabel(METODO_COBRO,c.metodo))}</td><td class="small mono">${esc(c.ref||'')}</td><td class="n">${mx(num(c.monto))}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Aún no se registran pagos.</div>'}</div></div>`}

/* ----- Pagos al broker ----- */
function vBroker(){const P=S.proyectos.filter(p=>(isConfirmed(p)||(p.pagosProv||[]).length)&&calc(p).fabUSD>0).map(p=>({p,c:calc(p)}));
  const all=[];S.proyectos.forEach(p=>(p.pagosProv||[]).forEach(x=>all.push({p,x})));all.sort((a,b)=>String(b.x.fecha).localeCompare(String(a.x.fecha)));
  const usd=all.reduce((a,o)=>a+num(o.x.usd),0),mxp=all.reduce((a,o)=>a+num(o.x.usd)*(num(o.x.tc)||num(S.cfg.tc)),0),com=all.reduce((a,o)=>a+num(o.x.comisionMXN),0);
  const debe=P.reduce((a,o)=>a+o.c.provDebeUSD,0);const tcProm=usd?mxp/usd:NaN;
  const bp=num(S.cfg.brokerAnticipoPct);
  return head('Pagos a Harry',`Esquema ${bp}% para producir y ${100-bp}% cuando está listo. Cada envío registra el tipo de cambio que te dieron y la comisión que cobró el banco o la casa de cambio.`,`<button class="btn pri" data-act="newPagoProv">Registrar envío al broker</button>`)+
  `<div class="sec"><div class="kpis"><div class="kpi warn"><div class="l">Debemos al broker</div><div class="v">${us(debe)}</div><div class="s">Esquema 50/50</div></div><div class="kpi"><div class="l">Enviado en total</div><div class="v">${mx(mxp)}</div><div class="s">${isUSD()?'Incluye diferencias de tipo de cambio':dls(usd)+' a Harry'}</div></div><div class="kpi"><div class="l">Tipo de cambio promedio</div><div class="v">${isFinite(tcProm)?tcProm.toFixed(2):'—'}</div><div class="s">Ajustes: ${num(S.cfg.tc)}</div></div><div class="kpi bad"><div class="l">Comisiones por enviar dinero</div><div class="v">${mx(com)}</div><div class="s">${usd?pct(com/mxp)+' de lo enviado':'—'}</div></div></div>
  <div class="panel tw"><h2>Por proyecto</h2>${P.length?`<table><thead><tr><th>Proyecto</th><th class="n">Pedido</th><th>${bp}% producir</th><th>${100-bp}% listo</th><th class="n">Envíos</th><th style="min-width:140px">Pagado</th><th class="n">Comisiones</th><th class="n">Debemos</th><th></th></tr></thead><tbody>${P.map(({p,c})=>{const a=c.provPagUSD>=c.brokerAnt-0.5,s=c.provPagUSD>=c.fabUSD-0.5;return `<tr><td class="click" data-open-p="${esc(p.id)}" style="cursor:pointer"><b class="mono">${esc(p.folio)}</b> ${esc(p.nombre||p.cliente||'')}<div class="small muted">${esc(SN[p.etapa])}</div></td><td class="n">${us(c.fabUSD)}</td><td>${a?'<span class="pill ok">Pagado</span>':`<span class="pill warn">${us(c.brokerAnt-Math.min(c.provPagUSD,c.brokerAnt))}</span>`}</td><td>${s?'<span class="pill ok">Pagado</span>':`<span class="pill">${us(c.fabUSD-Math.max(c.provPagUSD,c.brokerAnt))}</span>`}</td><td class="n">${(p.pagosProv||[]).length}</td><td>${barl(c.pctBroker,'br')}</td><td class="n">${mx(c.envioReal)}</td><td class="n">${c.provDebeUSD>0.5?`<b>${us(c.provDebeUSD)}</b>`:'—'}</td><td>${c.provDebeUSD>0.5?`<button class="btn sm" data-pagoprov="${esc(p.id)}">Registrar envío</button>`:''}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Aparecen los proyectos confirmados con costo de fábrica capturado.</div>'}</div>
  <div class="panel tw"><h2>Envíos de dinero</h2>${all.length?`<table><thead><tr><th>Fecha</th><th>Proyecto</th><th>Pago</th><th>Cuenta</th><th class="n">Monto</th><th class="n">Comisión</th><th class="n">Costo real</th></tr></thead><tbody>${all.map(({p,x})=>{const t=num(x.tc)||num(S.cfg.tc);const mxn=num(x.usd)*t;return `<tr class="click" data-open-p="${esc(p.id)}"><td>${fdate(x.fecha)}</td><td><span class="mono">${esc(p.folio)}</span> ${esc(p.cliente||'')}</td><td>${esc(x.nota||x.tipo||'')}<div class="small muted">${dls(num(x.usd))} a TC ${t.toFixed(2)}${x.ref?' · '+esc(x.ref):''}</div></td><td class="small">${cta(x.cuentaId)?esc(ctaName(x.cuentaId)):'<span class="pill bad">Sin cuenta</span>'}</td><td class="n">${mx(mxn)}</td><td class="n">${mx(num(x.comisionMXN))}</td><td class="n"><b>${mx(mxn+num(x.comisionMXN))}</b></td></tr>`}).join('')}</tbody><tfoot><tr><td colspan="4">Total</td><td class="n">${mx(mxp)}</td><td class="n">${mx(com)}</td><td class="n">${mx(mxp+com)}</td></tr></tfoot></table>`:'<div class="empty">Sin envíos registrados.</div>'}</div></div>`}

/* ----- Cotizaciones al broker ----- */
const RFQ_ST={borrador:['Borrador',''],enviada:['Enviada, esperando','warn'],respondida:['Respondida','acc'],aplicada:['Aplicada','ok']};
function vChina(){const R=[...S.rfqs].sort((a,b)=>String(b.folio).localeCompare(String(a.folio)));
  const body=R.length?`<div class="panel tw"><table><thead><tr><th>Folio</th><th>Broker</th><th>Proyecto</th><th>Responsable</th><th>Estado</th><th class="n">Partidas</th><th style="min-width:100px">Respondidas</th><th class="n">Días esperando</th></tr></thead><tbody>${R.map(r=>{const st=RFQ_ST[r.status||'borrador'];const d=r.status==='enviada'?days(r.enviada):null;const late=d!=null&&d>stageSla('china');const its=r.items||[];const resp=its.filter(x=>num(x.precioUSD)).length;

/* ----- Catálogo ----- */
function precioLista(s){const tc=num(S.cfg.tc);const fab=num(s.costoUSD)*tc;const costo=fab+num(s.cbm)*num(S.cfg.fleteCBMusd)*tc+fab*num(S.cfg.envioPct)/100;const d=1-num(S.cfg.margenPct)/100-num(S.cfg.comisionPct)/100;return d>0&&costo>0?costo/d*(1+num(S.cfg.ivaPct)/100):NaN}
function skuMedidas(s){return [s.largo,s.ancho,s.alto].some(Boolean)?[s.largo,s.ancho,s.alto].map(x=>x||'?').join('×'):''}
function vCatalogo(){
  const q=UI.catQ.toLowerCase();
  const cats=[...new Set(S.skus.map(s=>s.categoria).filter(Boolean))].sort();const fabs=[...new Set(S.skus.map(s=>s.fabrica).filter(Boolean))].sort();
  const L=S.skus.filter(vivo).filter(s=>(!q||[s.sku,s.codigoFabrica,s.nombre,s.material,s.fabrica,s.marcaOriginal,s.modeloOriginal].join(' ').toLowerCase().includes(q))&&(!UI.cat||s.categoria===UI.cat)&&(!UI.fab||s.fabrica===UI.fab)&&(!UI.tipo||(UI.tipo==='esp'?isEsp(s):!isEsp(s)))).sort((a,b)=>String(a.categoria).localeCompare(String(b.categoria))||String(a.consecutivo||a.sku).localeCompare(String(b.consecutivo||b.sku)));
  const sinCosto=S.skus.filter(s=>vivo(s)&&!isEsp(s)&&!num(s.costoUSD)).length;const nEsp=S.skus.filter(s=>isEsp(s)&&vivo(s)).length;
  const tools=`<input id="cq" data-live="1" placeholder="SKU, modelo, material" value="${esc(UI.catQ)}"><select id="cc"><option value="">Todas las categorías</option>${cats.map(c=>`<option ${UI.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="cf"><option value="">Todas las fábricas</option>${fabs.map(c=>`<option ${UI.fab===c?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="seg">${[['','Todo'],['cat','Catálogo'],['esp',`Especiales · ${nEsp}`]].map(([k,n])=>`<button class="${UI.tipo===k?'on':''}" data-tipo="${k}">${n}</button>`).join('')}</span><span class="seg"><button class="${UI.catVista==='fotos'?'on':''}" data-catv="fotos">Fotos</button><button class="${UI.catVista==='tabla'?'on':''}" data-catv="tabla">Tabla</button></span><button class="btn" data-act="import">Importar CSV</button><button class="btn" data-act="export">Exportar</button><button class="btn pri" data-act="newS">Nuevo SKU</button>`;
  let body;
  if(!S.skus.length)body=`<div class="empty">El catálogo está vacío. Importa un CSV o mándale tu Excel o PDF a Claude y lo carga por ti.</div>`;
  else if(UI.catVista==='fotos'){const groups={};L.forEach(s=>(groups[s.categoria||'Sin categoría']=groups[s.categoria||'Sin categoría']||[]).push(s));
    body=Object.entries(groups).map(([g,ls])=>`<div class="panel" style="margin-bottom:14px"><h2>${esc(g)} · ${ls.length}</h2><div class="pgrid">${ls.map(s=>`<button class="pc" data-open-s="${esc(s.id)}">${skuImg(s)?`<img class="ph" src="${esc(skuImg(s))}" alt="${esc(s.nombre)}" loading="lazy">`:'<span class="ph"></span>'}<span class="bd"><b>${esc(s.modelo||s.nombre)}</b><span>${esc(s.sku)}${s.consecutivo?' · '+esc(s.consecutivo):''}</span>${isEsp(s)?`<span><span class="pill br">${esc(optLabel(ESP_ST,s.estadoEsp||'por_cotizar'))}</span>${s.marcaOriginal?' ref. '+esc(s.marcaOriginal):''}</span>`:''}<span>${esc(s.fabrica||(isEsp(s)?'Sin fábrica':''))}${num(s.costoUSD)?' · '+us(num(s.costoUSD)):' · sin costo'}</span></span></button>`).join('')}</div></div>`).join('')||'<div class="empty">Nada coincide con la búsqueda.</div>';
  }else body=`<div class="panel tw"><table><thead><tr><th></th><th>SKU</th><th>#</th><th>Nombre</th><th>Categoría</th><th>Fábrica</th><th>Cód. fábrica</th><th>Medidas cm</th><th>Material</th><th class="n">Costo ref.</th><th class="n">CBM</th><th class="n">Precio lista</th></tr></thead><tbody>${L.map(s=>`<tr class="click" data-open-s="${esc(s.id)}"><td>${skuImg(s)?`<img class="thumb" src="${esc(skuImg(s))}" alt="" loading="lazy">`:'<span class="thumb"></span>'}</td><td class="mono">${esc(s.sku)}${isEsp(s)?`<div><span class="pill br">${esc(optLabel(ESP_ST,s.estadoEsp||'por_cotizar'))}</span></div>`:''}</td><td class="mono small">${esc(s.consecutivo||'')}</td><td><b>${esc(s.nombre)}</b></td><td>${esc(s.categoria||'')}</td><td>${esc(s.fabrica||'')}${s.marcaOriginal?`<div class="small muted">Ref. ${esc(s.marcaOriginal)} ${esc(s.modeloOriginal||'')}</div>`:''}</td><td class="mono">${esc(s.codigoFabrica||'—')}</td><td class="mono">${esc(skuMedidas(s)||'—')}</td><td>${esc([s.material,s.acabado].filter(Boolean).join(' · '))}</td><td class="n">${num(s.costoUSD)?us(num(s.costoUSD))+`<div class="small muted">${dls(num(s.costoUSD))}</div>`:'—'}</td><td class="n">${s.cbm?num(s.cbm).toFixed(2):'—'}</td><td class="n">${mx(precioLista(s))}</td></tr>`).join('')}</tbody></table></div>`;
  return head('Catálogo SKUs',`${S.skus.filter(s=>vivo(s)&&!isEsp(s)).length} SKUs de catálogo y ${nEsp} piezas especiales. El prefijo del SKU es la fábrica (DM Denmei, GV Gainsville, HY HYGD, TT TTW). ${sinCosto?`${sinCosto} sin costo de fábrica todavía: se llenan al aplicar las respuestas del broker.`:''}`,tools)+body;
}

/* ----- Taller ----- */
function vTaller(){const L=[...S.taller].sort((a,b)=>(a.fecha||'9').localeCompare(b.fecha||'9'));
  const act=L.filter(t=>!['terminado','cancelado'].includes(t.status));const debe=L.reduce((a,t)=>a+tallerCalc(t).debe,0);
  const cobrar=L.reduce((a,t)=>a+Math.max(0,num(t.cobroCliente)-num(t.cobrado)),0);

function confDate(p){const h=(p.historial||[]).find(x=>SI[x.etapa]>=SI.confirmado&&x.etapa!=='perdido');return h?h.fecha.slice(0,7):null}
function vReportes(){const P=S.proyectos;
  const months=[];const d=new Date();for(let i=11;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);months.push(`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`)}
  const vm=months.map(m=>({m,v:P.filter(p=>isConfirmed(p)&&confDate(p)===m).reduce((a,p)=>a+calc(p).precio,0)}));const mv=Math.max(1,...vm.map(x=>x.v));

function payTable(d,arr,cols){const L=d[arr]||[];return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}">${c.l}</th>`).join('')}<th></th></tr></thead><tbody>${L.map((x,i)=>`<tr>${cols.map(c=>`<td class="${c.n?'n':''}">${c.f(x)}</td>`).join('')}<td><button class="btn sm danger" data-rm-pay="${arr}:${i}" aria-label="Quitar">×</button></td></tr>`).join('')||`<tr><td class="muted small" colspan="${cols.length+1}">Sin registros</td></tr>`}</tbody></table></div>`}

  <div class="panel" id="sec-partidas" ${pt('piezas')}><h2>Partidas · ${(d.items||[]).length} piezas distintas · ${c.cbm.toFixed(1)} CBM</h2><datalist id="skul">${sl}</datalist>

function logPanel(d,c,emb){const tot=c.logRows.reduce((a,r)=>a+r.monto,0),pag=c.logRows.reduce((a,r)=>a+r.pag,0);

  await Promise.all(urls.map(async u=>{try{const b=await (await fetch(u)).blob();map[u]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r('');fr.readAsDataURL(b)})}catch(e){map[u]=''}}));
  return html.replace(/src="(\/_blob\/[^"]+)"/g,(m,u)=>map[u]?`src="${map[u]}"`:'src=""')}

async function saveR(){const id=M.id||newId('rfqs');const ok=await save('rfqs',id,M.d);if(ok){M.id=id;M.dirty=false;await syncSpecs(M.d);toast('Solicitud guardada');drawR()}return ok}
async function syncSpecs(r){if(!r.proyectoId)return;const p=proj(r.proyectoId);if(!p)return;const d=clone(p);delete d.id;let ch=false;
  (r.items||[]).forEach(x=>{const it=(d.items||[]).find(i=>i.sku&&i.sku===x.sku);if(!it)return;const mat=[x.material,x.acabado].filter(Boolean).join(' · ');
    if(x.medidas&&it.medidas!==x.medidas){it.medidas=x.medidas;ch=true}if(mat&&it.material!==mat){it.material=mat;ch=true}if(x.cant&&String(it.cant)!==String(x.cant)){it.cant=x.cant;ch=true}if(x.codigoFabrica&&it.codigoFabrica!==x.codigoFabrica){it.codigoFabrica=x.codigoFabrica;ch=true}});
  if(ch)await save('proyectos',r.proyectoId,d)}
async function applyRfq(){const r=M.d;let n=0;if(!(r.items||[]).some(x=>num(x.precioUSD))){toast('Primero escribe los precios que te mandó el broker.');return}const bname=provName(r.brokerId);
  for(const x of r.items||[]){if(!num(x.precioUSD))continue;const s=S.skus.find(k=>k.sku===x.sku);if(s){const h=(s.historial||[]).concat([{fecha:today(),costoUSD:num(x.precioUSD),cbm:num(x.cbm)||'',broker:bname,rfq:r.folio,medidas:x.medidas,material:x.material,moq:x.moq,diasProd:x.diasProd}]).slice(-30);
      const upd=Object.assign({},s,{historial:h,actualizado:nowIso()});delete upd.id;if(!x.medidas||x.medidas===skuMedidas(s)||!skuMedidas(s)){upd.costoUSD=num(x.precioUSD);if(num(x.cbm))upd.cbm=num(x.cbm);if(x.moq)upd.moq=x.moq;if(x.diasProd)upd.diasProd=x.diasProd}if(x.codigoFabrica&&!upd.codigoFabrica)upd.codigoFabrica=x.codigoFabrica;if(isEsp(upd)&&(upd.estadoEsp||'por_cotizar')==='por_cotizar')upd.estadoEsp='cotizada';
      await save('skus',s.id,upd);n++}}
  if(r.proyectoId){const p=proj(r.proyectoId);if(p){const d=clone(p);delete d.id;(d.items||[]).forEach(it=>{const cand=(r.items||[]).filter(y=>y.sku===it.sku&&num(y.precioUSD));const x=cand.find(y=>nrm(y.medidas)===nrm(it.medidas))||(cand.length===1?cand[0]:null);if(x){it.costoUSD=num(x.precioUSD);if(num(x.cbm))it.cbm=num(x.cbm);if(x.codigoFabrica)it.codigoFabrica=x.codigoFabrica;it.ref='';itConfirm(it,r.folio)}});
      if(r.brokerId&&!d.brokerId)d.brokerId=r.brokerId;d.check=d.check||{};d.check.cotChina=d.check.cotChina||nowIso();if(d.etapa==='china')moveStage(d,'cotizando');await save('proyectos',p.id,d)}}
  r.status='aplicada';if(!r.respondida)r.respondida=nowIso();await saveR();toast(`Precios aplicados${n?` · ${n} SKUs con nuevo costo`:''}`)}

    case 'payBack':M=M.back;drawP();break;
    case 'savePay':await savePay();break;
    case 'newCobro':openPay('cobros');break;
    case 'newPagoProv':openPay('pagosProv');break;
    case 'saveSeg':await saveSeg();break;
    case 'toRfq':{if(M.dirty||!M.id){await saveP();if(M.dirty)break}const p=M.d,pid=M.id;const pre=newRfq(p,pid);openRfq(null,pre);toast('Solicitud creada: revisa medidas y materiales y mándala');break}
    case 'toTaller':{if(M.dirty||!M.id){await saveP();if(M.dirty)break}const p=M.d;openG('taller',null,{proyectoId:M.id,direccion:p.direccion||'',cliente:p.cliente||'',resp:defResp('taller')||(p.resp||{}).cobranza||defResp('cobranza')});break}
    case 'quote':openQuote();break;
    case 'qBack':M=M.back;drawP();break;
    case 'qCopy':copy(quoteText(M.back.d));break;
    case 'qDown':{const d=M.back.d;toast('Preparando archivo con fotos…');const body=await inlineImgs(quoteHtml(d,true));const html=`<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cotización ${esc(d.folio)} · ${esc(S.cfg.empresa)}</title></head><body style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;max-width:820px;margin:40px auto;padding:0 24px;color:#2C2C2A;background:#F4EFE6;font-size:13px">${body}</body></html>`;try{await downloads.save({filename:`Cotizacion-${d.folio}-${(d.cliente||'cliente').replace(/[^\w]+/g,'-')}.html`,data:new Blob([html],{type:'text/html'})})}catch(err){if(err.code!=='declined')toast(err.message||'No se pudo descargar')}break}
    case 'newR':openRfq(null);break;
    case 'saveR':await saveR();break;
    case 'addRi':M.d.items=(M.d.items||[]).concat([{sku:'',codigoFabrica:'',nombre:'',cant:1,medidas:'',material:'',acabado:'',notas:'',precioUSD:'',cbm:'',moq:'',diasProd:''}]);markDirty();drawR();break;
    case 'rCopy':copy(rfqText(M.d));break;
    case 'rSent':{M.d.status='enviada';M.d.enviada=nowIso();if(await saveR()&&M.d.proyectoId){const p=proj(M.d.proyectoId);if(p&&['cotizando'].includes(p.etapa)){const d=clone(p);delete d.id;moveStage(d,'china');await save('proyectos',p.id,d)}}toast('Marcada como enviada. El proyecto queda esperando al broker.');break}
    case 'rDown':{const r=M.d;toast('Preparando hoja con fotos…');const body=await inlineImgs(rfqSheet(r));const html=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(r.folio)} · ${esc(S.cfg.empresa)}</title></head><body style="font-family:Helvetica,Arial,sans-serif;max-width:980px;margin:30px auto;padding:0 20px;color:#2C2C2A;font-size:13px">${body}</body></html>`;try{await downloads.save({filename:`${r.folio}-${S.cfg.empresa.replace(/\s+/g,'-')}.html`,data:new Blob([html],{type:'text/html'})})}catch(err){if(err.code!=='declined')toast(err.message||'No se pudo descargar')}break}
    case 'rApply':await applyRfq();break;
    case 'delR':armDelete(t,async()=>{if(M.id)await del('rfqs',M.id);closeM(true);toast('Solicitud eliminada')});break;
    case 'newS':openSku(null);break;
    case 'saveS':await saveS();break;
    case 'delS':armDelete(t,async()=>{await del('skus',M.id);closeM(true);toast('SKU eliminado')});break;
    case 'import':openImport();break;
    case 'doImport':await doImport();break;
    case 'export':await doExport();break;
    case 'newT':openG('tareas',null,{personaId:UI.persona||UI.yo||''});break;
    case 'newG':openG('gastos',null);break;
    case 'newV':openG('proveedores',null);break;
    case 'newTL':openG('taller',null);break;
    case 'newE':openG('embarques',null);break;
    case 'saveG':await saveG();break;
    case 'delG':armDelete(t,async()=>{const c=M.col,id=M.id;await del(c,id);if(c==='embarques'){for(const p of S.proyectos.filter(p=>p.embarqueId===id)){const d=clone(p);delete d.id;d.embarqueId='';await save('proyectos',p.id,d)}}closeM(true);toast('Eliminado')});break;
    case 'saveCfg':{const c=readCfg();c.personas.forEach(p=>{if(!p.id)p.id=rid()});c.personas=c.personas.filter(p=>String(p.nombre||'').trim());if(await save('config','main',c))toast('Ajustes guardados');break}
    case 'addPP':{const c=readCfg();c.personas.push({id:rid(),nombre:'',roles:[],pct:'',funcion:''});S.cfg=c;render();break}
  }
});
document.addEventListener('input',e=>{const el=e.target;
  const live=(id,key)=>{UI[key]=el.value;const pos=el.selectionStart;render();const n=$('#'+id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}};
  if(el.id==='pq')return live('pq','q');
  if(el.id==='cq')return live('cq','catQ');
  if(el.id==='clq')return live('clq','clQ');
  if(el.id==='pk-q'){UI.pk.q=el.value;drawPicker();return}
  if(!M)return;
  if(el.dataset.f){let v=el.dataset.money?fromD(el.value):el.value;if(el.dataset.f==='iva')v=v==='1';setPath(M.d,el.dataset.f,v);markDirty();$('#calc').innerHTML=calcHtml(calc(M.d));return}
  if(el.dataset.ck){M.d.check=M.d.check||{};if(el.checked)M.d.check[el.dataset.ck]=today();else delete M.d.check[el.dataset.ck];markDirty();drawP();return}
  if(el.dataset.cot){M.d.cotizaciones[+el.dataset.cot].estado=el.value;const v=el.value;if(v==='aceptada'){if(!num(M.d.precioManual))M.d.precioManual=Math.round(calc(M.d).precio);if(SI[M.d.etapa]<SI.confirmado)moveStage(M.d,'confirmado')}if(v==='rechazada'){moveStage(M.d,'perdido')}markDirty();drawP();return}
  if(el.dataset.pl){const [i,k]=el.dataset.pl.split(':');M.d.plan[+i][k]=k==='pct'?el.value:el.value;markDirty();if(k!=='concepto'&&e.type==='input'&&el.type!=='date')return;return}
  if(el.dataset.it){const [i,k]=el.dataset.it.split(':');const it=M.d.items[+i];it[k]=el.value;if(k==='sku'&&skuToItem(it,el.value)){markDirty();drawP();const n=$(`[data-it="${i}:cant"]`);if(n)n.focus();return}
    if(k==='costoUSD')it.ref='';
    if((k==='medidas'||k==='material')&&e.type==='change'&&!itOk(it)){const hm=histMatch(it.sku,it.medidas,it.material);if(hm&&num(hm.costoUSD)!==num(it.costoUSD)){it.costoUSD=hm.costoUSD;if(num(hm.cbm))it.cbm=hm.cbm;it.ref='Previo '+String(hm.fecha||'').slice(5).split('-').reverse().join('/');toast('Harry ya cotizó esta medida antes: se usa ese costo como referencia');markDirty();drawP();return}}
    if((k==='medidas'||k==='material')&&e.type==='change'){markDirty();drawP();return}
    markDirty();const s=$('#sub'+i);if(s)s.textContent=us(num(it.cant)*num(it.costoUSD));$('#calc').innerHTML=calcHtml(calc(M.d));return}
  if(el.dataset.ri){const [i,k]=el.dataset.ri.split(':');const it=M.d.items[+i];it[k]=el.value;if(k==='sku'){const s=S.skus.find(x=>x.sku===el.value);if(s){it.codigoFabrica=it.codigoFabrica||s.codigoFabrica||'';it.nombre=it.nombre||s.nombre;it.medidas=it.medidas||skuMedidas(s);it.material=it.material||s.material||'';it.acabado=it.acabado||s.acabado||'';markDirty();drawR();return}}
    markDirty();$('#rfqt').textContent=rfqText(M.d);return}
  if(el.dataset.rf){M.d[el.dataset.rf]=el.value;markDirty();$('#rfqt').textContent=rfqText(M.d);return}
  if(el.dataset.sf){M.d[el.dataset.sf]=el.value;markDirty();return}
  if(el.dataset.es){M.d[el.dataset.es]=el.value;if(el.dataset.es==='cat')drawEsp();return}
  if(el.dataset.pf){const k=el.dataset.pf;M.d[k]=el.dataset.money?fromD(el.value):el.value;
    if(M.arr==='pagosLog'){if(k==='concepto'){M.d=Object.assign(logDef(M.base||{},el.value),{fecha:M.d.fecha||today(),cuentaId:M.d.cuentaId});drawPay();return}
      if(['cbm','tarifaUSD','tc'].includes(k)&&!(k==='tc'&&false)){M.d.mxn=Math.round(num(M.d.cbm)*num(M.d.tarifaUSD)*num(M.d.tc));const m=document.querySelector('[data-pf="mxn"]');if(m)m.value=toD(M.d.mxn)}}
    const i=$('#payInfo');if(i)i.innerHTML=payInfo();return}
  if(el.dataset.g){M.d[el.dataset.g]=el.type==='checkbox'?el.checked:el.dataset.money?fromD(el.value):el.value;if(M.col==='gastos'&&el.dataset.g==='tipo')M.d.categoria='otro';markDirty();return}
  if(el.dataset.gm){const [k,id]=el.dataset.gm.split(':');const s=new Set(M.d[k]||[]);el.checked?s.add(id):s.delete(id);M.d[k]=[...s];markDirty();return}
});
document.addEventListener('change',async e=>{const el=e.target;
  if(el.id==='pp'){UI.persona=el.value;render();return}
  if(el.id==='cc'){UI.cat=el.value;render();return}
  if(el.id==='cf'){UI.fab=el.value;render();return}
  if(el.id==='bk-f'){UI.cta=el.value;render();return}
  if(el.dataset.asg!==undefined){const m=(UI.ledger||[])[+el.dataset.asg];if(m){rememberCta(el.value);await assignCta(m,el.value)}return}
  if(el.dataset.tgT){const t=S.tareas.find(x=>x.id===el.dataset.tgT);if(t){const d=clone(t);delete d.id;d.hecha=el.checked;d.hechaEn=el.checked?nowIso():'';await save('tareas',t.id,d)}return}
  if(el.id==='csvF'&&el.files[0]){const r=new FileReader();r.onload=()=>{$('#csvT').value=r.result};r.readAsText(el.files[0]);return}
  if(el.id==='docF'&&el.files.length&&assets&&M&&M.kind==='p'){await uploadDocs([...el.files]);return}
  if(el.dataset.docAp&&M&&M.kind==='p'){const x=(M.d.docs||[]).find(y=>y.id===el.dataset.docAp);if(x){x.aprobado=el.checked;if(el.checked){M.d.check=M.d.check||{};M.d.check.render=M.d.check.render||today()}markDirty();await saveP()}return}
  if((el.id==='espImg'||el.id==='refImg')&&el.files[0]&&assets){toast('Subiendo foto…');try{const res=await assets.upload(el.files[0]);M.d.fotoRef=res.url;M.d.fotoRefId=res.id;if(el.id==='espImg')drawEsp();else{markDirty();drawS();toast('Foto lista. Guarda el SKU.')}}catch(err){toast(err.code==='too_large'?'La foto pesa demasiado (máx 20 MB).':err.message||'No se pudo subir')}return}
  if((el.id==='skuImg'||el.id==='logoF')&&el.files[0]&&assets){toast('Subiendo imagen…');try{const res=await assets.upload(el.files[0]);if(el.id==='skuImg'){M.d.foto=res.url;M.d.fotoId=res.id;markDirty();drawS();toast('Foto lista. Guarda el SKU.')}else{const c=readCfg();c.logo=res.url;if(await save('config','main',c))toast('Logo guardado')}}catch(err){toast(err.code==='too_large'?'La imagen pesa demasiado (máx 20 MB).':err.message||'No se pudo subir')}return}
  if(M&&M.kind==='p'&&el.dataset.pl){drawP();return}
  if(M&&M.kind==='p'&&el.dataset.f&&el.tagName==='SELECT'){drawP();return}
  if(M&&M.kind==='g'&&(el.dataset.g&&(el.tagName==='SELECT'||el.type==='checkbox')||el.dataset.gm)){drawG();return}
});
document.addEventListener('submit',async e=>{if(e.target.id!=='movf')return;e.preventDefault();const m=num($('#mv-m').value);if(!m){toast('Escribe el monto.');return}
  if(await save('movs',newId('movs'),{socioId:$('#mv-s').value,tipo:$('#mv-t').value,monto:m,fecha:$('#mv-f').value||today(),nota:$('#mv-n').value,creado:nowIso()}))toast('Movimiento registrado')});
document.addEventListener('toggle',e=>{const el=e.target;if(el&&el.dataset&&el.dataset.more&&M){if(el.dataset.more==='1')M.more=el.open;else M.more2=el.open}},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&M)closeM()});
boot();
</script>
</html>
